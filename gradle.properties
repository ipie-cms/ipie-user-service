org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The ipie-platform-mca version this service builds against. One property, one deliberate bump -
# that is the trade the extraction buys: this service is no longer dragged by every platform change,
# but it must choose when to take one. Automate the bump as a PR gated on this repository's own CI.
# Never a dynamic `1.+` or a snapshot version: builds stop being reproducible and one bad platform
# commit would reach every service unchecked. This pins an exact released version, and bumping it is
# a deliberate act - see ipie-platform-mca/gradle.properties for how a release is cut.
ipiePlatformVersion=0.1.0
