# Local-only convenience profile - NOT activated by docker-compose.yml (that stack runs a real
# Keycloak and authenticates against it, per its own header comment and MASTER_CODE_STANDARDS.md).
# Disables JWT authentication so the CRUD endpoints can be exercised with plain curl with nothing
# else running - activate it yourself only for a bare `SPRING_PROFILES_ACTIVE=local ./gradlew
# bootRun` (or `java -jar`) with no Keycloak available at all. Never activate this profile against
# the docker-compose stack or any other environment with a real identity provider present.
ipie:
  security:
    enabled: false

logging:
  level:
    in.gov.ipie: DEBUG

