# English base bundle for this service - intentionally EMPTY of error-code keys.
#
# Why the file must exist at all: Spring Boot's MessageSourceAutoConfiguration is gated on
# ResourceBundleCondition, which probes only for the *base* "<basename>.properties" and never
# looks at locale variants. With messages_hi.properties as the sole file here, that probe found
# nothing, the whole MessageSource backed off, and every code fell through to MessageResolver's
# default - so no Hindi translation ever resolved, silently. See
# UserControllerIntegrationTest.getUser_notFound_returnsTheHindiTranslationWhenAcceptLanguageAsksForIt.
#
# Why it stays empty: MessageResolver falls back to the caller-supplied default, which is the
# exception's own English message - and that message carries the instance-specific detail
# ("User <id> was not found") that a static bundle entry cannot. Adding an English key here would
# replace that richer message with a generic sentence, losing the id. Hindi accepts exactly that
# trade-off in messages_hi.properties because there is no alternative for a non-English locale
# until exceptions pass structured arguments (see MessageResolver's Javadoc).
#
# So: add a key here only for a message with no dynamic detail to lose, never as a mirror of
# messages_hi.properties.
