# PROD - deployed from the `master` branch, for ipie-user-service.
#
#     SPRING_PROFILES_ACTIVE=deployed,prod
#
# The hardening shared by every deployed environment is in application-deployed.yml, which this
# profile assumes is active alongside it. Only this environment's own differences belong here.
#
# Keep this file and application-preprod.yml identical in every control. PPE exists to be
# indistinguishable from here; a divergence means PPE stops proving anything about go-live.

management:
  endpoints:
    web:
      exposure:
        # Only what monitoring needs. Anything else - env, beans, mappings, configprops - describes
        # the running system's internals to whoever can reach the port.
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${IPIE_TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  # The API contract is published to integrating teams through the documentation process, not by
  # leaving a live schema endpoint exposed.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
