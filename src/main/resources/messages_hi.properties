# Hindi translations of this service's own UserErrorCode entries (in.gov.ipie.service.user.exception.UserErrorCode).
# Picked up automatically alongside common-messages_hi.properties via the platform default
# spring.messages.basename=common-messages,messages (see ipie-i18n-defaults.yml) - no code change
# needed in this service beyond adding this file. Generic per the MessageResolver's documented
# trade-off: the specific username/email/mobile-number baked into the English exception message at
# throw time is not reproduced here, only the general sentence for the error code.
#
# Starting-point translations, not yet professionally reviewed - see common-messages_hi.properties.
USER_NOT_FOUND=उपयोगकर्ता नहीं मिला
USERNAME_ALREADY_EXISTS=उपयोगकर्ता नाम पहले से मौजूद है
EMAIL_ALREADY_EXISTS=ईमेल पहले से पंजीकृत है
MOBILE_NUMBER_ALREADY_EXISTS=मोबाइल नंबर पहले से पंजीकृत है
INVALID_VERIFICATION_TOKEN=सत्यापन टोकन अमान्य या समाप्त हो चुका है
REGISTRATION_ALREADY_COMPLETED=पंजीकरण पहले ही पूरा हो चुका है
